l(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="822.0" y="338.2">POST /audio/transcriptions (60 s)</tspan></text><line x1="949" y1="373.0" x2="701" y2="373.0" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="822.0" y="365.7">Texte</tspan></text><line x1="690" y1="400.5" x2="442" y2="400.5" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="568.0" y="393.2">transcript + APICallLog</tspan></text><line x1="700" y1="428.0" x2="821" y2="428.0" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="758.5" y="420.7">Supprime l&#x27;audio</tspan></text><path d="M700,448.5 h28 v12 h-26" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="735.0" y="458.2">Classe l&#x27;émotion (modèle local)</tspan></text><path d="M700,476.0 h28 v12 h-26" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="start"><tspan x="735.0" y="485.7">Budget OK ? prompt minimisé</tspan></text><line x1="700" y1="510.5" x2="948" y2="510.5" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="822.0" y="503.2">POST /images/generations (90 s)</tspan></text><line x1="949" y1="538.0" x2="701" y2="538.0" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)"/><text font-size="10.5" font-weight="400" fill="#0f172a" text-anchor="middle"><tspan x="822.0" y="530.7">Image (base64)</tspan></text><line x1="700" y1="565.5" x2="821" y2="565.5" stroke="#475569"