# Environnement complet en local : web, worker, PostgreSQL, Redis (KAN-9).
# Lancement : docker compose up --build   →   http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synthetiseur
      POSTGRES_USER: synthetiseur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthetiseur}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthetiseur -d synthetiseur"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://synthetiseur:${POSTGRES_PASSWORD:-synthetiseur}@db:5432/synthetiseur
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      MEDIA_ROOT: /app/media
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://synthetiseur:${POSTGRES_PASSWORD:-synthetiseur}@db:5432/synthetiseur
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      MEDIA_ROOT: /app/media
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  media:
