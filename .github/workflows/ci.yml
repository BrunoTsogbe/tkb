# Intégration continue (KAN-10) : chaque PR et chaque push sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typage, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Ruff (PEP 8, imports, docstrings Google)
        run: ruff check . && ruff format --check .
      - name: Mypy (django-stubs)
        run: mypy
      - name: Audit des dépendances
        run: pip-audit -r app/requirements.txt

  tests:
    name: Tests (PostgreSQL, couverture ≥ 70 %)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: synthetiseur
          POSTGRES_USER: synthetiseur
          POSTGRES_PASSWORD: synthetiseur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U synthetiseur" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://synthetiseur:synthetiseur@localhost:5432/synthetiseur
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Migrations à jour
        working-directory: app
        run: python manage.py makemigrations --check --dry-run
      - name: Contrôles de déploiement
        working-directory: app
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-to-pass-the-deploy-check-0123456789
        run: python manage.py check --deploy --fail-level WARNING
      - name: Pytest
        run: pytest app/tests --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

  docker:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: synthetiseur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
