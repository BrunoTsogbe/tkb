# Déploiement continu (KAN-11) : après une CI verte sur main uniquement.
# Secrets du dépôt : RENDER_DEPLOY_HOOK_WEB, RENDER_DEPLOY_HOOK_WORKER ; variable : APP_URL.
# Retour arrière : relancer ce workflow sur le SHA précédent (onglet Actions → Run workflow).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image (tag = SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Déclencher Render (web puis worker)
        env:
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -z "$HOOK_WEB" ]; then echo "RENDER_DEPLOY_HOOK_WEB non configuré : déploiement ignoré."; exit 0; fi
          curl -fsS -X POST "$HOOK_WEB"
          [ -n "$HOOK_WORKER" ] && curl -fsS -X POST "$HOOK_WORKER" || true
      - name: Test de fumée /healthz/
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/healthz/" | grep -q '"status": "ok"'; then echo "Application en ligne."; exit 0; fi
            sleep 20
          done
          echo "L'application ne répond pas après 10 minutes." && exit 1
